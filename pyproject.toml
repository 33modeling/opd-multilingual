[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopd"
version = "0.1.0"
description = "Multilingual staged post-training experiments (SFT, on-policy distillation, RL) for small students"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.51", "numpy>=1.26"]

[project.optional-dependencies]
langid = ["fasttext-wheel>=0.9.2"]
test = ["pytest>=8"]

[project.scripts]
mlopd = "mlopd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
